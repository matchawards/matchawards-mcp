name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/matchawards-mcp
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Tag must equal the package version and both server.json versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/matchawards_mcp/__init__.py').read())[1])")
          listing=$(python3 -c "import json; d = json.load(open('server.json')); print(d['version'], d['packages'][0]['version'])")
          echo "tag=$GITHUB_REF_NAME package=$pkg server.json=$listing"
          [ "$GITHUB_REF_NAME" = "v$tag" ] && [ "$pkg" = "$tag" ] && [ "$listing" = "$tag $tag" ]

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # mcp-publisher login github-oidc
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher (pinned, sha256 from the release's checksums file)
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to the official MCP Registry
        run: ./mcp-publisher publish
